name: Prod - Build and deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

env:
  ARTIFACT_NAME: 'prod-michaelouellette' # set this to the name you want for the artifact
  NODE_VERSION: '22.x'                # set this to the node version to use
  PUBLISH_DIR: './dist/app/browser'     # set this to the directory you want to publish
  PUBLISH_BRANCH: 'gh-pages'           # set this to the branch you want to

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Cache Node Modules
      id: npm-cache
      uses: actions/cache@v5
      with:
        path: "**/node_modules"
        key: mononode-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
    - name: NPM Install
      if: steps.npm-cache.outputs.cache-hit != 'true'
      run: npm ci --legacy-peer-deps
    - name: Build App
      run: |
        npm run build:ssr
    - name: Display structure of downloaded files
      run: |
         # Output artifact contents.
         ls -Ra ${{ env.PUBLISH_DIR }}
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
         github_token: ${{ secrets.GITHUB_TOKEN }}
         publish_dir: ${{ env.PUBLISH_DIR }}
         publish_branch: ${{ env.PUBLISH_BRANCH }}
