<div class="home-component">
	<img width="300" alt="Michael Ouellette" src="assets/logo.png">
	<h1>Michael Ouellette</h1>
	<h2>Software Engineering Manager | Design Systems, Frontend Architecture &amp; Web Performance</h2>
	<div class="socialIcons">
		@for (item of socialIcons; track item.link) {
			<a
				class="socialIcons__icon"
				target="_blank"
				rel="noopener"
				[href]="item.link"
				[title]="item.title">
				<span class="mdi mdi-{{ item.icon }}"></span>
			</a>
		}
	</div>
</div>
